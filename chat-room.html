<!DOCTYPE html>
<html>
<head>
    <title>Femboy Cafe Chat Room</title>
    <style>
        :root {
            --pink: #ff69b4;
            --light-pink: #ffb6c1;
            --purple: #9370db;
            --light-purple: #e6e6fa;
            --blue: #90c8ff;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffb6c1, #e6e6fa);
            font-family: 'Comic Sans MS', cursive;
            color: #ff69b4;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 25px;
            border: 5px dashed var(--pink);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
        }
        
        .sidebar-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .sidebar-title {
            font-size: 28px;
            color: var(--purple);
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 0 var(--light-pink);
        }
        
        .femboy-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--blue), var(--pink));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 3px solid var(--pink);
        }
        
        .user-info {
            background: linear-gradient(to bottom, #ffe6f2, #f0e6ff);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 2px solid var(--purple);
        }
        
        .username-input {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid var(--light-pink);
            font-family: 'Comic Sans MS', cursive;
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--purple);
        }
        
        .username-display {
            font-size: 20px;
            color: var(--purple);
            text-align: center;
            font-weight: bold;
        }
        
        .online-users {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 3px solid var(--light-pink);
            overflow-y: auto;
        }
        
        .online-title {
            color: var(--purple);
            font-size: 20px;
            margin: 0 0 15px 0;
            text-align: center;
        }
        
        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .user-item {
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #fff0f5;
            border-radius: 15px;
            border: 2px solid var(--light-pink);
            display: flex;
            align-items: center;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .user-emoji {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .user-name {
            color: var(--purple);
            font-size: 16px;
        }
        
        .user-status {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            margin-left: auto;
            animation: pulse 2s infinite;
        }
        
        /* Chat Area Styles */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            border: 5px dashed var(--pink);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(to right, var(--pink), var(--purple));
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }
        
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: linear-gradient(180deg, #fffaf0, #f8f8ff);
        }
        
        .message {
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 25px;
            max-width: 80%;
            animation: messageAppear 0.3s;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.own {
            background: linear-gradient(to right, #ffd1dc, #ffb6c1);
            margin-left: auto;
            border-top-right-radius: 5px;
        }
        
        .message.other {
            background: linear-gradient(to right, #e6e6fa, #d8bfd8);
            margin-right: auto;
            border-top-left-radius: 5px;
        }
        
        .message.system {
            background: linear-gradient(to right, #90c8ff, #ff8fab);
            color: white;
            margin: 10px auto;
            text-align: center;
            max-width: 90%;
            font-size: 14px;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .message-sender {
            font-weight: bold;
            color: var(--purple);
            font-size: 16px;
        }
        
        .message-time {
            font-size: 12px;
            color: #999;
            margin-left: auto;
        }
        
        .message-content {
            font-size: 16px;
            color: #333;
        }
        
        .message-emoji {
            font-size: 20px;
            margin-right: 5px;
        }
        
        .reaction-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
        }
        
        .reaction-btn {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .reaction-btn:hover {
            transform: scale(1.2);
            background: #fff0f5;
        }
        
        /* Chat Input Styles */
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 3px solid var(--light-pink);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .message-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 25px;
            border: 3px solid var(--light-pink);
            font-family: 'Comic Sans MS', cursive;
            font-size: 16px;
            color: var(--purple);
            resize: none;
            height: 60px;
            transition: all 0.3s;
        }
        
        .message-input:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }
        
        .send-button {
            background: linear-gradient(45deg, var(--pink), var(--purple));
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }
        
        .emoji-picker {
            background: white;
            border: 3px solid var(--light-pink);
            border-radius: 15px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            position: absolute;
            bottom: 80px;
            left: 20px;
            display: none;
            z-index: 100;
        }
        
        .emoji-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        
        .emoji-btn:hover {
            background: #fff0f5;
            transform: scale(1.2);
        }
        
        .emoji-toggle {
            background: linear-gradient(to right, #ffd1dc, #e6e6fa);
            border: 3px solid var(--light-pink);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .emoji-toggle:hover {
            background: linear-gradient(to right, #ffb6c1, #d8bfd8);
        }
        
        /* Control Buttons */
        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .control-btn {
            flex: 1;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid var(--light-pink);
            background: white;
            color: var(--purple);
            font-family: 'Comic Sans MS', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: #fff0f5;
            transform: translateY(-2px);
        }
        
        .back-button {
            background: linear-gradient(to right, var(--blue), var(--pink));
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-family: 'Comic Sans MS', cursive;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.5);
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #fff0f5;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--pink), var(--purple));
            border-radius: 5px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
                padding: 10px;
            }
            
            .sidebar {
                width: 100%;
                height: 200px;
            }
            
            .chat-area {
                height: calc(100vh - 220px);
            }
        }
        
        /* Order Display */
        .order-display {
            background: linear-gradient(to right, #ffb6c1, #e6e6fa);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px dashed var(--pink);
        }
        
        .order-title {
            font-size: 18px;
            color: var(--purple);
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .order-details {
            font-size: 14px;
            color: #333;
        }
        
        .order-item-display {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">🌸 Femboy Cafe 🌸</h2>
                <div class="femboy-avatar">💖</div>
            </div>
            
            <div class="user-info">
                <input type="text" 
                       class="username-input" 
                       id="usernameInput" 
                       placeholder="Enter your cute name..."
                       maxlength="20">
                <div class="username-display" id="usernameDisplay">
                    Guest🌸
                </div>
            </div>
            
            <div class="online-users">
                <h3 class="online-title">🟢 Online Now (<span id="onlineCount">0</span>)</h3>
                <ul class="user-list" id="userList">
                    <!-- Users will be added here dynamically -->
                </ul>
            </div>
            
            <div class="control-buttons">
                <button class="control-btn" id="clearChatBtn">🗑️ Clear Chat</button>
                <button class="control-btn" id="shareOrderBtn">🍰 Share Order</button>
            </div>
            
            <button class="back-button" onclick="window.location.href='index.html'">
                <span>🏠</span> Back to Cafe
            </button>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                💬 Femboy Cafe Chat Room 💬
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here -->
                <div class="message system">
                    Welcome to the Femboy Cafe Chat! 💕 Be nice and have fun! 🌸
                </div>
                <div class="message system">
                    Type a message below to start chatting! ✨
                </div>
                <div id="orderDisplayContainer"></div>
            </div>
            
            <div class="chat-input-area">
                <div class="emoji-toggle" id="emojiToggle">
                    😊
                </div>
                
                <div class="emoji-picker" id="emojiPicker">
                    <!-- Emojis will be added here -->
                </div>
                
                <textarea class="message-input" 
                          id="messageInput" 
                          placeholder="Type your cute message here... 💝"
                          maxlength="500"></textarea>
                
                <button class="send-button" id="sendButton">
                    💖
                </button>
            </div>
        </div>
    </div>
    
    <!-- Audio for notification sounds -->
    <audio id="messageSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="joinSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-game-ball-tap-2073.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey-ChangeThisToYourOwn",
            authDomain: "femboy-cafe-chat.firebaseapp.com",
            databaseURL: "https://femboy-cafe-chat-default-rtdb.firebaseio.com",
            projectId: "femboy-cafe-chat",
            storageBucket: "femboy-cafe-chat.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };
        
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // DOM Elements
        const usernameInput = document.getElementById('usernameInput');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');
        const userList = document.getElementById('userList');
        const emojiToggle = document.getElementById('emojiToggle');
        const emojiPicker = document.getElementById('emojiPicker');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const shareOrderBtn = document.getElementById('shareOrderBtn');
        const onlineCount = document.getElementById('onlineCount');
        const orderDisplayContainer = document.getElementById('orderDisplayContainer');
        
        // Audio elements
        const messageSound = document.getElementById('messageSound');
        const joinSound = document.getElementById('joinSound');
        
        // User data
        let username = 'Guest🌸' + Math.floor(Math.random() * 999);
        let userId = Date.now() + Math.random();
        let userRef;
        let usersRef = database.ref('users');
        let messagesRef = database.ref('messages');
        
        // Emoji list
        const emojis = ['💖', '🌸', '✨', '🎀', '💕', '💗', '💓', '💞', '💝', '💘',
                       '😊', '🥰', '😍', '😘', '🤗', '💋', '💐', '🌺', '🌷', '🌼',
                       '🍰', '☕', '🍵', '🧁', '🍨', '🍧', '🎂', '🍭', '🍬', '🍫',
                       '🌈', '🌟', '⭐', '☀️', '🌙', '☁️', '⚡', '❄️', '🔥', '💧',
                       '🎵', '🎶', '🎮', '🎨', '📚', '🎭', '🎪', '🎯', '🎲', '🎳'];
        
        // Initialize
        function init() {
            // Set initial username
            usernameDisplay.textContent = username;
            
            // Load saved username if exists
            const savedUsername = localStorage.getItem('femboyChatUsername');
            if (savedUsername) {
                username = savedUsername;
                usernameInput.value = savedUsername;
                usernameDisplay.textContent = savedUsername;
            }
            
            // Populate emoji picker
            emojis.forEach(emoji => {
                const emojiBtn = document.createElement('div');
                emojiBtn.className = 'emoji-btn';
                emojiBtn.textContent = emoji;
                emojiBtn.onclick = () => {
                    messageInput.value += emoji;
                    messageInput.focus();
                };
                emojiPicker.appendChild(emojiBtn);
            });
            
            // Check for saved order from cafe game
            displayOrderIfExists();
            
            // Connect to Firebase
            connectToFirebase();
        }
        
        // Connect to Firebase for real-time chat
        function connectToFirebase() {
            // Add user to online list
            userRef = database.ref('users/' + userId);
            userRef.set({
                name: username,
                emoji: getUserEmoji(username),
                joined: firebase.database.ServerValue.TIMESTAMP,
                lastActive: firebase.database.ServerValue.TIMESTAMP
            });
            
            // Update last active every 30 seconds
            setInterval(() => {
                if (userRef) {
                    userRef.update({
                        lastActive: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            }, 30000);
            
            // Listen for user changes
            usersRef.on('value', (snapshot) => {
                updateUserList(snapshot.val());
            });
            
            // Listen for new messages
            messagesRef.limitToLast(100).on('child_added', (snapshot) => {
                const message = snapshot.val();
                if (message.userId !== userId) { // Don't show own messages (they're added locally)
                    addMessage(message.content, message.username, false, message.timestamp);
                }
            });
            
            // Clean up inactive users (offline for 2 minutes)
            setInterval(() => {
                const cutoff = Date.now() - 120000; // 2 minutes
                usersRef.once('value', (snapshot) => {
                    snapshot.forEach((childSnapshot) => {
                        const user = childSnapshot.val();
                        if (user.lastActive < cutoff) {
                            childSnapshot.ref.remove();
                        }
                    });
                });
            }, 60000); // Check every minute
        }
        
        // Event Listeners
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                updateUsername();
            }
        });
        
        usernameInput.addEventListener('blur', updateUsername);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendButton.addEventListener('click', sendMessage);
        
        emojiToggle.addEventListener('click', () => {
            emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
        });
        
        clearChatBtn.addEventListener('click', () => {
            if (confirm('Clear all messages? (This only clears your view)')) {
                chatMessages.innerHTML = `
                    <div class="message system">
                        Welcome to the Femboy Cafe Chat! 💕 Be nice and have fun! 🌸
                    </div>
                    <div class="message system">
                        Type a message below to start chatting! ✨
                    </div>
                    <div id="orderDisplayContainer"></div>
                `;
                displayOrderIfExists();
            }
        });
        
        shareOrderBtn.addEventListener('click', () => {
            const orderData = localStorage.getItem('femboyCafeOrder');
            if (orderData) {
                const order = JSON.parse(orderData);
                const orderMessage = `🍰 I just ordered: ${order.cake} with ${order.cakeSize} and ${order.tea} (${order.teaSize}) - Total: $${order.totalPrice} 🎀`;
                sendMessage(orderMessage);
            } else {
                alert("No order found! Please order from the cafe first. 🍰");
            }
        });
        
        // Close emoji picker when clicking outside
        document.addEventListener('click', (e) => {
            if (!emojiToggle.contains(e.target) && !emojiPicker.contains(e.target)) {
                emojiPicker.style.display = 'none';
            }
        });
        
        // Functions
        function updateUsername() {
            const newUsername = usernameInput.value.trim();
            if (newUsername && newUsername !== username) {
                const oldUsername = username;
                username = newUsername;
                usernameDisplay.textContent = username;
                localStorage.setItem('femboyChatUsername', username);
                
                // Update in Firebase
                if (userRef) {
                    userRef.update({
                        name: username,
                        emoji: getUserEmoji(username)
                    });
                }
                
                // Send system message locally
                addSystemMessage(`${oldUsername} changed their name to ${username} ✨`);
            }
        }
        
        function sendMessage() {
            const messageContent = messageInput.value.trim();
            if (!messageContent) return;
            
            // Add message locally first
            addMessage(messageContent, username, true, Date.now());
            
            // Send to Firebase
            const messageData = {
                userId: userId,
                username: username,
                content: messageContent,
                timestamp: Date.now()
            };
            
            messagesRef.push(messageData);
            
            // Clear input
            messageInput.value = '';
            messageInput.focus();
            
            // Play sound
            messageSound.currentTime = 0;
            messageSound.play();
        }
        
        function addMessage(content, sender, isOwn, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
            
            const time = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">
                        <span class="message-emoji">${getUserEmoji(sender)}</span>
                        ${sender}
                    </span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${formatMessage(content)}</div>
                <div class="reaction-bar">
                    <div class="reaction-btn" onclick="addReaction(this, '💖')">💖</div>
                    <div class="reaction-btn" onclick="addReaction(this, '😂')">😂</div>
                    <div class="reaction-btn" onclick="addReaction(this, '😮')">😮</div>
                    <div class="reaction-btn" onclick="addReaction(this, '🌸')">🌸</div>
                </div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function updateUserList(users) {
            if (!users) {
                userList.innerHTML = '<li class="user-item">No users online 😢</li>';
                onlineCount.textContent = '0';
                return;
            }
            
            userList.innerHTML = '';
            let count = 0;
            
            Object.keys(users).forEach(userId => {
                const user = users[userId];
                count++;
                
                const userItem = document.createElement('li');
                userItem.className = 'user-item';
                userItem.innerHTML = `
                    <span class="user-emoji">${user.emoji || '🌸'}</span>
                    <span class="user-name">${user.name} ${userId === window.userId ? '(You)' : ''}</span>
                    <div class="user-status"></div>
                `;
                userList.appendChild(userItem);
            });
            
            onlineCount.textContent = count;
        }
        
        function getUserEmoji(name) {
            // Simple hash to get consistent emoji per user
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const emojiIndex = Math.abs(hash) % emojis.length;
            return emojis[emojiIndex];
        }
        
        function formatMessage(text) {
            // Simple formatting for common patterns
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }
        
        function addReaction(button, emoji) {
            button.textContent = emoji;
            button.style.transform = 'scale(1.3)';
            button.style.background = '#ffebee';
            
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 300);
            
            // Play sound
            messageSound.currentTime = 0;
            messageSound.play();
        }
        
        function displayOrderIfExists() {
            const orderData = localStorage.getItem('femboyCafeOrder');
            if (orderData) {
                const order = JSON.parse(orderData);
                
                const orderDisplay = document.createElement('div');
                orderDisplay.className = 'order-display';
                orderDisplay.innerHTML = `
                    <div class="order-title">🍰 Your Order from Femboy Cafe 🎀</div>
                    <div class="order-details">
                        <div class="order-item-display"><strong>Cake:</strong> ${order.cake} (${order.cakeSize})</div>
                        <div class="order-item-display"><strong>Tea:</strong> ${order.tea} (${order.teaSize})</div>
                        <div class="order-item-display"><strong>Toppings:</strong> ${order.toppings}</div>
                        <div class="order-item-display"><strong>Sweetness:</strong> ${order.sweetness}</div>
                        <div class="order-item-display"><strong>Total:</strong> $${order.totalPrice}</div>
                        ${order.specialRequest !== "No special request" ? `<div class="order-item-display"><strong>Special Request:</strong> ${order.specialRequest}</div>` : ''}
                    </div>
                `;
                
                orderDisplayContainer.appendChild(orderDisplay);
                
                // Auto-share order to chat
                setTimeout(() => {
                    const orderMessage = `🎀 Just placed an order at Femboy Cafe! I got ${order.cake} and ${order.tea} 🍰☕`;
                    sendMessage(orderMessage);
                }, 2000);
            }
        }
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (userRef) {
                userRef.remove();
            }
        });
        
        // Initialize chat
        init();
    </script>
</body>
</html>
