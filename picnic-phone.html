<!DOCTYPE html>
<html>
<head>
    <title>Cute Phone Games!</title>
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec, #f3e5f5);
            color: #ec407a;
            font-family: 'Comic Sans MS', cursive;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 40px;
            border: 15px solid #ff80ab;
            box-shadow: 0 0 50px rgba(255, 128, 171, 0.3);
            position: relative;
        }
        
        .phone-notch {
            width: 180px;
            height: 25px;
            background: #ff80ab;
            border-radius: 20px;
            margin: -45px auto 20px;
            position: relative;
        }
        
        .phone-title {
            font-size: 36px;
            color: #ec407a;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .phone-apps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        
        .app-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #f48fb1, #ce93d8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            margin: 0 auto;
        }
        
        .app-icon:hover {
            transform: scale(1.1);
            border-color: #ec407a;
            box-shadow: 0 0 20px #f48fb1;
        }
        
        .app-label {
            text-align: center;
            margin-top: 5px;
            font-size: 12px;
            color: #ad1457;
        }
        
        .phone-screen {
            background: #f8bbd9;
            border-radius: 20px;
            padding: 20px;
            min-height: 200px;
            margin: 20px 0;
            border: 3px solid #f48fb1;
        }
        
        .screen-content {
            background: white;
            border-radius: 10px;
            padding: 15px;
            min-height: 170px;
            text-align: center;
        }
        
        .tap-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .tap-button {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #f48fb1, #ff80ab);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.2s;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .tap-button:active {
            transform: scale(0.9);
        }
        
        .score-display {
            font-size: 24px;
            color: #ec407a;
        }
        
        .back-button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: linear-gradient(to right, #ec407a, #f48fb1);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            border: 2px solid #ad1457;
            text-align: center;
            width: 150px;
        }
        
        .phone-time {
            text-align: center;
            color: #ad1457;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .message-bubble {
            background: #f3e5f5;
            padding: 10px;
            border-radius: 15px;
            margin: 10px;
            max-width: 80%;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="phone-notch"></div>
        
        <div class="phone-time" id="currentTime">🌸 3:45 PM 🌸</div>
        
        <h1 class="phone-title">📱 Cute Phone 📱</h1>
        
        <div class="phone-apps">
            <div>
                <div class="app-icon" onclick="openApp('game')">🎮</div>
                <div class="app-label">Tap Game</div>
            </div>
            <div>
                <div class="app-icon" onclick="openApp('chat')">💬</div>
                <div class="app-label">Messages</div>
            </div>
            <div>
                <div class="app-icon" onclick="openApp('camera')">📸</div>
                <div class="app-label">Camera</div>
            </div>
            <div>
                <div class="app-icon" onclick="openApp('music')">🎵</div>
                <div class="app-label">Music</div>
            </div>
            <div>
                <div class="app-icon" onclick="openApp('shop')">🛍️</div>
                <div class="app-label">Cute Shop</div>
            </div>
            <div>
                <div class="app-icon" onclick="openApp('social')">✨</div>
                <div class="app-label">Social</div>
            </div>
        </div>
        
        <div class="phone-screen">
            <div class="screen-content" id="screenContent">
                <h3>🌸 Welcome! 🌸</h3>
                <p>Tap an app to start playing!</p>
                <div style="font-size: 30px; margin-top: 20px;">
                    🎀 📱 💖
                </div>
            </div>
        </div>
        
        <a href="picnic.html" class="back-button">← Back to Picnic</a>
    </div>

    <script>
        let tapScore = 0;
        let gameActive = false;
        
        // Update time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('currentTime').textContent = `🌸 ${timeString} 🌸`;
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        function openApp(app) {
            const screen = document.getElementById('screenContent');
            
            switch(app) {
                case 'game':
                    screen.innerHTML = `
                        <div class="tap-game">
                            <h3>💖 Tap the Heart! 💖</h3>
                            <div class="score-display">Score: <span id="score">0</span></div>
                            <button class="tap-button" onclick="tapHeart()">💖</button>
                            <p>Tap as fast as you can for 10 seconds!</p>
                        </div>
                    `;
                    startTapGame();
                    break;
                    
                case 'chat':
                    screen.innerHTML = `
                        <h3>💬 Messages</h3>
                        <div style="text-align: left;">
                            <div class="message-bubble">Lily: Want to hang out later? 🌸</div>
                            <div class="message-bubble">Alex: The picnic was so fun! 🧺</div>
                            <div class="message-bubble">Sam: New cute outfit! 👗</div>
                            <div class="message-bubble" style="background: #bbdefb;">You: Having so much fun! ✨</div>
                        </div>
                    `;
                    break;
                    
                case 'camera':
                    screen.innerHTML = `
                        <h3>📸 Camera</h3>
                        <div style="background: #2c2c2c; height: 150px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; margin: 10px 0;">
                            📷 Camera View 📷
                        </div>
                        <p>Say cheese! 😊</p>
                        <div style="font-size: 30px;">
                            📸 🤳 🌸
                        </div>
                    `;
                    break;
                    
                case 'music':
                    screen.innerHTML = `
                        <h3>🎵 Music Player</h3>
                        <div style="margin: 20px 0;">
                            <div style="font-size: 30px;">🎶</div>
                            <p>Now Playing: Cute Vibes 🌸</p>
                        </div>
                        <div style="display: flex; justify-content: center; gap: 20px;">
                            <button style="font-size: 30px; background: none; border: none; cursor: pointer;">⏮️</button>
                            <button style="font-size: 30px; background: none; border: none; cursor: pointer;">▶️</button>
                            <button style="font-size: 30px; background: none; border: none; cursor: pointer;">⏭️</button>
                        </div>
                    `;
                    break;
                    
                case 'shop':
                    screen.innerHTML = `
                        <h3>🛍️ Cute Shop</h3>
                        <p>🌸 Available Items 🌸</p>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px;">
                            <div style="text-align: center;">
                                <div style="font-size: 30px;">🎀</div>
                                <div>Flower Crown</div>
                                <div style="font-size: 12px; color: #ec407a;">50 coins</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 30px;">👗</div>
                                <div>Pastel Dress</div>
                                <div style="font-size: 12px; color: #ec407a;">100 coins</div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'social':
                    screen.innerHTML = `
                        <h3>✨ Social Media</h3>
                        <p>Latest Posts:</p>
                        <div style="text-align: left; font-size: 14px;">
                            <div style="background: #f5f5f5; padding: 10px; border-radius: 10px; margin: 5px 0;">
                                <strong>Lily:</strong> Best picnic ever! 🧺🌸 #cute
                            </div>
                            <div style="background: #f5f5f5; padding: 10px; border-radius: 10px; margin: 5px 0;">
                                <strong>You:</strong> Making new friends! 💖 #femboyvibes
                            </div>
                        </div>
                    `;
                    break;
            }
        }
        
        function startTapGame() {
            tapScore = 0;
            gameActive = true;
            
            setTimeout(() => {
                gameActive = false;
                const screen = document.getElementById('screenContent');
                screen.innerHTML = `
                    <div class="tap-game">
                        <h3>🎮 Game Over! 🎮</h3>
                        <div style="font-size: 48px; color: #ec407a;">${tapScore}</div>
                        <p>Final Score!</p>
                        ${tapScore > 20 ? "🎉 Amazing! You're a tapping pro! 🎉" : "Good job! Try again for higher score!"}
                    </div>
                `;
            }, 10000);
        }
        
        function tapHeart() {
            if (!gameActive) return;
            
            tapScore++;
            document.getElementById('score').textContent = tapScore;
            
            // Animate the button
            const button = document.querySelector('.tap-button');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 100);
        }
    </script>
</body>
</html>
